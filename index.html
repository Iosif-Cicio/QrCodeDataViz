<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gänsendorf International</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<!-- Globe fills the screen, behind everything -->
<canvas id="globe"></canvas>

<!-- Top bar: USTP logo left, DE/EN toggle right -->
<div id="topbar">
  <a id="brand" href="#" aria-label="FH en">
    <img src="/src/assets/fh-gaensendorf-logo.svg" alt="FH Gänsendorf" />
  </a>
  <div id="lang" data-lang="en" aria-label="Language">
    <span class="lang-label de">DE</span>
    <button class="lang-switch" type="button" aria-label="Switch language">
      <span class="knob"></span>
    </button>
    <span class="lang-label en active">EN</span>
  </div>
</div>

<!-- Overlaid UI -->
<main id="app">
  <header id="head">
    <h1 id="title"><!-- rendered by main.js (holds the live count) --></h1>
    <p id="intro-text" data-t="intro"></p>
  </header>

  <div id="bottom">
    <div class="story-box">
      <div id="progress"></div>

      <section id="post" hidden>
        <div class="post-head">
          <span id="post-author" class="post-author"></span>
          <span id="post-country" class="chip"></span>
        </div>
        <p id="post-text" class="post-text"></p>
      </section>
    </div>

    <div class="actions">
      <button id="add-btn" class="pill-btn" type="button" data-t="add">Add quote</button>
      <button id="wall-btn" class="pill-btn" type="button" data-t="wall">Quote Wall</button>
    </div>
    <p id="dot-note" data-t="note">Each dot represents a student</p>
  </div>
</main>

<!-- Quote Wall overlay -->
<div id="wall" class="wall" hidden>
  <div class="wall-head">
    <div class="wall-heading">
      <h2 class="wall-title" data-t="wallTitle">What our students say</h2>
      <p class="wall-sub"><span id="wall-count">0</span> <span data-t="wallSub">quotes</span></p>
    </div>
    <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
  </div>

  <div class="wall-body">
    <div class="wall-filters">
      <div class="combo">
        <input id="wall-region" type="text" autocomplete="off"
               aria-label="Region" data-t-ph="allRegions" />
        <ul id="wall-region-list" class="combo-list" hidden></ul>
      </div>
      <div class="combo">
        <input id="wall-country" type="text" autocomplete="off"
               aria-label="Country" data-t-ph="allCountries" />
        <ul id="wall-country-list" class="combo-list" hidden></ul>
      </div>
      <input id="wall-search" class="wall-search" type="search"
             autocomplete="off" data-t-ph="searchName" />
    </div>
    <div id="wall-grid" class="wall-grid"></div>
  </div>
</div>

<!-- Add-a-dot modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <form id="add-form" class="sheet" novalidate>
    <div class="sheet-head">
      <h2 data-t="formTitle">Add your dot</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
    </div>

    <label>
      <span data-t="fName">Name or nickname</span>
      <input id="f-name" name="name" type="text" autocomplete="off" maxlength="40" required />
    </label>

    <label>
      <span data-t="fCountry">Country</span>
      <div class="combo">
        <input id="f-country" name="country" type="text"
               autocomplete="off" data-t-ph="countryPlaceholder" required />
        <ul id="country-list" class="combo-list" hidden></ul>
      </div>
      <small id="f-country-err" class="err" data-t="fCountryErr" hidden>Pick a country from the list.</small>
    </label>

    <label>
      <span class="lbl"><span data-t="fCity">City</span> <span class="opt" data-t="fCityOpt">(optional)</span></span>
      <div class="combo">
        <input id="f-city" name="city" type="text"
               autocomplete="off" data-t-ph="cityDisabled" disabled />
        <ul id="city-list" class="combo-list" hidden></ul>
      </div>
    </label>

    <label>
      <span data-t="fText">One line about the FH Gänsendorf</span>
      <textarea id="f-text" name="text" rows="2" maxlength="120" required
                data-t-ph="textPlaceholder"></textarea>
      <div class="field-foot">
        <small id="req-note" class="req-note" data-t="required">Required</small>
        <small class="count-hint"><span id="f-text-count">0</span>/120</small>
      </div>
    </label>

    <button type="submit" class="submit-btn" data-t="submit">Add my dot</button>
  </form>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
