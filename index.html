<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>USTP's World</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<!-- Globe fills the screen, behind everything -->
<canvas id="globe"></canvas>

<!-- Top bar: USTP logo left, DE/EN toggle right -->
<div id="topbar">
  <a id="brand" href="https://www.fhstp.ac.at/en" aria-label="USTP — University of Applied Sciences St. Pölten">
    <img src="/src/ustp-logo.svg" alt="USTP" />
  </a>
  <div id="lang" data-lang="en" aria-label="Language">
    <span class="lang-label de">DE</span>
    <button class="lang-switch" type="button" aria-label="Switch language">
      <span class="knob"></span>
    </button>
    <span class="lang-label en active">EN</span>
  </div>
</div>

<!-- Overlaid UI -->
<main id="app">
  <header id="head">
    <h1 id="title"><!-- rendered by main.js (holds the live count) --></h1>
    <p id="intro-text" data-i18n="intro"></p>
  </header>

  <div id="bottom">
    <div class="story-box">
      <div id="progress"></div>

      <section id="post" hidden>
        <div class="post-head">
          <span id="post-author" class="post-author"></span>
          <span id="post-country" class="chip"></span>
        </div>
        <p id="post-text" class="post-text"></p>
      </section>
    </div>

    <button id="add-btn" type="button" data-i18n="add">Add a dot</button>
    <p id="dot-note" data-i18n="note">Each dot represents a student</p>
  </div>
</main>

<!-- Add-a-dot modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <form id="add-form" class="sheet" novalidate>
    <div class="sheet-head">
      <h2 data-i18n="formTitle">Add your dot</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
    </div>

    <label>
      <span data-i18n="fName">Name or nickname</span>
      <input id="f-name" name="name" type="text" autocomplete="off" maxlength="40" required />
    </label>

    <label>
      <span data-i18n="fCountry">Country</span>
      <input id="f-country" name="country" type="text" list="country-list"
             autocomplete="off" data-i18n-ph="countryPlaceholder" required />
      <datalist id="country-list"></datalist>
      <small id="f-country-err" class="err" data-i18n="fCountryErr" hidden>Pick a country from the list.</small>
    </label>

    <label>
      <span data-i18n="fCity">City</span> <span class="opt" data-i18n="fCityOpt">(optional)</span>
      <input id="f-city" name="city" type="text" list="city-list"
             autocomplete="off" data-i18n-ph="cityDisabled" disabled />
      <datalist id="city-list"></datalist>
    </label>

    <label>
      <span data-i18n="fText">One line about the USTP</span>
      <textarea id="f-text" name="text" rows="2" maxlength="120" required
                data-i18n-ph="textPlaceholder"></textarea>
      <small class="count-hint"><span id="f-text-count">0</span>/120</small>
    </label>

    <button type="submit" class="submit-btn" data-i18n="submit">Add my dot</button>
  </form>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
